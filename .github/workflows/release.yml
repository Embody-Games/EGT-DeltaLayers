name: release

# A tag is the trigger. scripts/release.mjs creates it, so a release is one command.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the suites
        run: |
          if [ ! -d test ]; then
            echo "no test/ directory yet, nothing to run"
            exit 0
          fi
          for suite in test/run_tests.js test/run_tests_52.js; do
            if [ -f "$suite" ]; then
              echo "== $suite"
              node "$suite"
            fi
          done

      - name: Check the tag matches the version in the plugin
        run: |
          V="${GITHUB_REF_NAME#v}"
          IN_PLUGIN="$(sed -n "s/^const PLUGIN_VERSION = '\(.*\)';$/\1/p" embodygames_texture_layer_bridge.js)"
          if [ "$V" != "$IN_PLUGIN" ]; then
            echo "tag is $GITHUB_REF_NAME but the plugin says $IN_PLUGIN"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/release_notes.mjs "$V" > RELEASE_NOTES.md
          TITLE="$(node scripts/release_notes.mjs "$V" --title-only)"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME${TITLE:+: $TITLE}" \
            --notes-file RELEASE_NOTES.md \
            embodygames_texture_layer_bridge.js \
            changelog.json
