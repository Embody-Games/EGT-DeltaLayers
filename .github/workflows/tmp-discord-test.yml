# TEMPORARY. Proves the Discord step end to end without cutting a release.
# Delete this file once the post has been seen.
name: tmp discord test

on:
  push:
    branches: [standardise-release-tooling]

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      PLUGIN_FILE: delta_layers.js
      PLUGIN_NAME: Delta Layers
      PLUGIN_ICON_URL: https://raw.githubusercontent.com/Embody-Games/EGT-DeltaLayers/main/delta_layers_icon.png
      PLUGIN_COLOR: 5865F2
      DISCORD_THREAD_ID: '1545338449211559976'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Is the secret actually reachable from this repo?
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "DISCORD_WEBHOOK_URL is EMPTY here."
            echo "Either it was added as a secret on a different repo, or the org"
            echo "secret does not list this repo in its access policy."
            exit 1
          fi
          echo "secret is present"

      - name: Post 1.5.1 to the forum thread
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/discord_notify.mjs 1.5.1
